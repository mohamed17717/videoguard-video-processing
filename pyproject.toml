[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vg_pipeline"
version = "1.0.0"
description = "Reusable media-processing pipeline library for the video-guard AWS worker"
readme = "CONTRACT.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pycryptodome>=3.20",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vg_pipeline*", "vg_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
